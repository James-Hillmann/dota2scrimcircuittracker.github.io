<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Pages live at /warrior/players/ etc. too: resolve style.css, data/ and img/ from the root. -->
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AD2L Stat Tracker</title>
  <meta name="description" content="Dota 2 AD2L and scrim stats: standings, weekly recaps, players, heroes and predictions.">
  <meta name="theme-color" content="#0c0b0a">
  <!-- Link previews. Other pages get their own from scripts/deploy/share-pages.js at deploy. -->
  <meta property="og:site_name" content="AD2L Stat Tracker">
  <meta property="og:type" content="website">
  <meta property="og:title" content="AD2L Stat Tracker">
  <meta property="og:description" content="Dota 2 AD2L and scrim stats: standings, weekly recaps, players, heroes and predictions.">
  <meta property="og:url" content="https://dota2scrimcircuittracker.github.io/">
  <meta property="og:image" content="https://dota2scrimcircuittracker.github.io/img/og/site.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="AD2L Stat Tracker: standings, weekly recaps, players, heroes and predictions">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://dota2scrimcircuittracker.github.io/">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <!-- Third-party modules (Firebase, Tesseract, modern-screenshot) load only if their bytes match
       these hashes. After changing a CDN URL or version: node scripts/gen/cdn-integrity.js -->
  <script type="importmap">
  {
    "integrity": {
      "https://cdn.jsdelivr.net/npm/modern-screenshot@4.7.0/dist/index.mjs": "sha384-eDCjprrMFWrElLAfGhefpqsn3Vyw6dm8//RmsFZjqo8/AZ1P/CEiLIiLX7Zc64B3",
      "https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.esm.min.js": "sha384-fDdNU3AFf+hEiUiSjD96lSEFawtCYOWQFSrFyHZOkX2jhwuUQKiSOAgWNfuKg4B6",
      "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js": "sha384-cB901C0jnWultb8ZAaei2mehR8EQfJQfMBokc5Z5dc56nSWK3DgeQCJsIkE7DJg8",
      "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js": "sha384-nAwz6HvSTJ343VaB9sqZFItIinAPkFyiRV2sk7FSMgfcNPSltnISTMD7RQz8yEBf",
      "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js": "sha384-D9sv3kF5iLMmc0vLazG8S4gM2bVmmBw+lb+7Cn0pIpfdMOpWTVrLBLrweEmES+YZ"
    }
  }
  </script>
  <!-- Fonts are served from this site (fonts/), not from Google Fonts. They came from
       fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@600;800;900&family=Epilogue:wght@400;500;600;700&family=Martian+Mono:wght@300;400;600 -->
  <link rel="preload" href="fonts/epilogue-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/big-shoulders-stencil-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="cosmetics-effects.css">
  <link rel="stylesheet" href="collection.css">
  <!-- Colour-blind mode and the theme (settings cog), set before the first paint so the colours don't flash. -->
  <script>try {
    const h = document.documentElement, theme = localStorage.getItem("theme");
    if (localStorage.getItem("colorblind") === "1") h.classList.add("cb");
    if (theme === "light" || theme === "grey") { h.classList.add(theme); document.querySelector('meta[name="theme-color"]').content = theme === "light" ? "#efe9df" : "#2b2d31"; }
  } catch { /* storage blocked */ }</script>
</head>
<body>
  <a class="skip-link" id="skip-link" href="#app">Skip to content</a>
  <!-- Atmosphere: the river band and grain sit behind everything. -->
  <div class="river" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <header class="top">
    <a class="brand" id="home-link" href="#/" title="Home">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i></span>
      <span class="brand-word" id="league-name">AD2L<b>Stat Tracker</b></span>
    </a>
    <nav id="nav"></nav>
    <div class="top-tools">
      <div class="search" id="search" role="search">
        <input id="search-in" type="search" placeholder="Teams, players, heroes, stats…" autocomplete="off" spellcheck="false"
          aria-label="Search teams, players, heroes and stats in any league" aria-controls="search-pop" aria-expanded="false" aria-autocomplete="list" role="combobox">
        <kbd class="search-key" aria-hidden="true">/</kbd>
        <div class="search-pop" id="search-pop" role="listbox" aria-label="Players and teams" hidden></div>
      </div>
      <!-- The table builder (pages/search.js &table=), in the league being viewed (app.js sets the link). -->
      <a class="tb-btn" id="table-btn" href="#/scrims/search?table=team" title="Table builder: any stat, any filter, as a table" aria-label="Table builder">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="1"/><path d="M3.5 9.5h17M3.5 14.5h17M9.5 9.5v10"/></svg>
      </a>
      <div class="switcher">
        <button class="league-btn" id="league-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="league-menu">League<span class="caret" aria-hidden="true"></span></button>
        <div class="league-menu" id="league-menu" hidden>
          <div class="menu-label">Switch league</div>
          <a href="#/scrims" data-league="scrim"><b>Scrim League</b><span>Our scrims · uploaded screenshots</span></a>
          <!-- The AD2L divisions go here, lowest first (app.js, from lib/divisions.js). -->
          <a href="#/all/" data-league="all"><b>AD2L · All Divisions</b><span>Every division in one view</span></a>
        </div>
      </div>
      <button class="fb-open" id="fb-open" type="button" title="Suggest a change: mark up any page and say what you'd change" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M9 10.5h6M12 7.5v6"/></svg>
        <span class="fb-open-label">Feedback</span><b class="pack-offer-badge" data-offer-badge="feedback" aria-label="Unclaimed bonus pack">1</b><b class="fb-badge" hidden>0</b>
      </button>
      <!-- Steam sign-in (Fantasy): "Sign in", or your avatar linking to your page (parts/me.js). -->
      <div class="me" id="me"></div>
      <div class="settings">
        <button class="settings-btn" id="settings-btn" type="button" title="Settings" aria-label="Settings" aria-haspopup="true" aria-expanded="false" aria-controls="settings-pop">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="7.5" stroke-width="3.5" stroke-dasharray="3.1 2.79"/><circle cx="12" cy="12" r="5.2" stroke-width="2.2"/></svg>
        </button>
        <div class="settings-pop" id="settings-pop" hidden>
          <div class="menu-label">Settings</div>
          <div class="settings-theme" role="radiogroup" aria-label="Theme">
            <label><input type="radio" name="theme" value="dark"> Dark</label>
            <label><input type="radio" name="theme" value="grey"> Grey</label>
            <label><input type="radio" name="theme" value="light"> Light</label>
          </div>
          <label class="settings-row"><input type="checkbox" id="cb-mode"> Colour-blind mode</label>
          <label class="settings-row" title="Page tabs (Table, Matches, Stats…) , and the Content page's weeks, move into a sidebar that slides in from the left edge"><input type="checkbox" id="rail-mode"> Move subtabs</label>
          <label class="settings-team"><span class="menu-label">My team</span><select id="my-team"><option value="">None set</option></select>
            <small>Hero grids read the draft model against this team. Kept in this browser.</small></label>
          <!-- Time machine: only on pages it applies to (app.js timeBar); its week panel opens in place. -->
          <div class="tm" id="tm" hidden>
            <div class="menu-label">Time machine</div>
            <button class="tm-btn" id="tm-btn" type="button" aria-expanded="false" aria-controls="tm-pop">All weeks</button>
            <div class="tm-pop" id="tm-pop" hidden></div>
          </div>
        </div>
      </div>
    </div>
  </header>
  <div class="div-switch" id="div-switch" hidden></div>
  <main id="app"></main>
  <footer class="foot">
    <span>Not affiliated with Valve.</span>
    <!-- Where the numbers come from; on AD2L pages, when that division last synced (app.js footSync). -->
    <span class="foot-data">AD2L data from <a href="https://dota.playon.gg/" target="_blank" rel="noopener">PlayOn</a> and
      <a href="https://www.opendota.com/" target="_blank" rel="noopener">OpenDota</a>; scrims uploaded here<span id="foot-sync"></span> · <a href="#/privacy">Privacy</a></span>
    <div class="foot-links">
      <button class="tour-open" id="tour-open" type="button" title="A guided tour of the site">New here? <span class="pack-offer-badge" data-offer-badge="tour" aria-label="Unclaimed bonus pack">1</span></button>
      <a class="discord-join" data-pack-offer="discord" href="https://discord.gg/rPWa2tvt9k" target="_blank" rel="noopener" title="Join the Discord · earn a bonus pack" aria-label="Join the Discord and earn a bonus pack">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="currentColor"><path d="M20.32 4.37a19.8 19.8 0 0 0-4.89-1.52.07.07 0 0 0-.08.04c-.21.38-.44.87-.61 1.25a18.27 18.27 0 0 0-5.49 0 12.6 12.6 0 0 0-.62-1.25.08.08 0 0 0-.08-.04 19.74 19.74 0 0 0-4.89 1.52.07.07 0 0 0-.03.03C.53 9.05-.32 13.58.1 18.06a.08.08 0 0 0 .03.06 19.9 19.9 0 0 0 5.99 3.03.08.08 0 0 0 .08-.03c.46-.63.87-1.3 1.23-1.99a.08.08 0 0 0-.04-.11 13.1 13.1 0 0 1-1.87-.89.08.08 0 0 1-.01-.13l.37-.29a.07.07 0 0 1 .08-.01c3.93 1.79 8.18 1.79 12.07 0a.07.07 0 0 1 .08.01l.37.29a.08.08 0 0 1-.01.13c-.6.35-1.22.65-1.87.89a.08.08 0 0 0-.04.11c.36.7.77 1.36 1.22 1.99a.08.08 0 0 0 .08.03 19.84 19.84 0 0 0 6-3.03.08.08 0 0 0 .03-.06c.5-5.18-.84-9.67-3.55-13.66a.06.06 0 0 0-.03-.03zM8.02 15.33c-1.18 0-2.16-1.09-2.16-2.42 0-1.33.96-2.42 2.16-2.42 1.21 0 2.18 1.1 2.16 2.42 0 1.33-.96 2.42-2.16 2.42zm7.97 0c-1.18 0-2.16-1.09-2.16-2.42 0-1.33.96-2.42 2.16-2.42 1.21 0 2.18 1.1 2.16 2.42 0 1.33-.95 2.42-2.16 2.42z"/></svg>
        <span class="discord-join-label">Join the Discord</span><b class="pack-offer-badge" data-offer-badge="discord" aria-label="Unclaimed bonus pack">1</b>
      </a>
    </div>
  </footer>
  <datalist id="hero-list"></datalist>
  <datalist id="player-list"></datalist>
  <script type="module" src="app.js"></script>
</body>
</html>
