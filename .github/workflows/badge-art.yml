# One-off (claude/ branches): find the Dota Plus hero badge art STRATZ and Valve serve, and
# print where it lives. Remove once the art is in public/img/hero-badges/.
name: Badge art

on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/badge-art.yml"]

permissions:
  contents: read

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: STRATZ CDN bucket listing
        run: |
          for q in "?prefix=images/dota2/&delimiter=/" "?list-type=2&prefix=images/dota2/&delimiter=/"; do
            echo "== $q"; curl -s "https://cdn.stratz.com/$q" | grep -oE '<Prefix>[^<]*</Prefix>|<Key>[^<]*</Key>|<Code>[^<]*</Code>' | head -80
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: STRATZ in a browser
        run: |
          mkdir -p b && cd b && npm init -y >/dev/null && npm i -s playwright@1.56.1 >/dev/null && npx playwright install chromium >/dev/null
          cat > run.mjs <<'EOF'
          import { chromium } from "playwright";
          const b = await chromium.launch();
          const p = await b.newPage({ userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36", viewport: { width: 1400, height: 1000 } });
          const imgs = new Set();
          p.on("response", (r) => { const u = r.url(); if (/\.(png|webp|svg|jpg)(\?|$)/i.test(u) || r.headers()["content-type"]?.startsWith("image/")) imgs.add(`${r.status()} ${u}`); });
          for (const path of ["/players/75379546", "/players/75379546/heroes", "/players/75379546/dota-plus"]) {
            await p.goto("https://stratz.com" + path, { waitUntil: "networkidle", timeout: 60000 }).catch((e) => console.log("goto", e.message));
            await p.waitForTimeout(4000);
            console.log("PAGE", path, "title:", await p.title());
          }
          const all = [...imgs];
          console.log("images:", all.length);
          for (const u of all.filter((u) => !/\/heroes\/|\/items\/|abilities|avatars|steamcdn|steamstatic.*avatars/i.test(u))) console.log(u);
          // Elements that look like hero level badges in the DOM.
          const dom = await p.evaluate(() => [...document.querySelectorAll("img,svg,[style*='background']")].map((e) => e.getAttribute("src") || e.style?.backgroundImage || "").filter((s) => /badge|plus|level|tier|rank/i.test(s)).slice(0, 40));
          console.log("DOM refs:", JSON.stringify([...new Set(dom)], null, 1));
          await p.screenshot({ path: "stratz.png", fullPage: false });
          await b.close();
          EOF
          node run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stratz-shot
          path: b/stratz.png
