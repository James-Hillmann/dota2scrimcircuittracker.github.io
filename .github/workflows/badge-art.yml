# One-off (claude/ branches): find the Dota Plus hero badge art STRATZ and Valve serve, and
# print where it lives. Remove once the art is in public/img/hero-badges/.
name: Badge art

on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/badge-art.yml"]

permissions:
  contents: write # commit the badge art to the branch

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: STRATZ CDN bucket listing
        run: |
          for q in "?prefix=images/dota2/&delimiter=/" "?list-type=2&prefix=images/dota2/&delimiter=/"; do
            echo "== $q"; curl -s "https://cdn.stratz.com/$q" | grep -oE '<Prefix>[^<]*</Prefix>|<Key>[^<]*</Key>|<Code>[^<]*</Code>' | head -80
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: STRATZ in a browser
        run: |
          mkdir -p b && cd b && npm init -y >/dev/null && npm i -s playwright@1.56.1 >/dev/null && npx playwright install chromium >/dev/null
          cat > run.mjs <<'EOF'
          import { chromium } from "playwright";
          import { writeFileSync, appendFileSync } from "node:fs";
          const b = await chromium.launch();
          const p = await b.newPage({ userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36", viewport: { width: 1400, height: 1000 } });
          writeFileSync("all.js", "");
          p.on("response", async (r) => {
            const ct = r.headers()["content-type"] ?? "";
            if (/javascript/.test(ct)) { try { appendFileSync("all.js", (await r.text()) + "\n"); } catch {} }
          });
          await p.goto("https://stratz.com/players/75379546", { waitUntil: "load", timeout: 60000 }).catch((e) => console.log("goto", e.message));
          await p.waitForTimeout(12000);
          console.log("title:", await p.title());
          await p.screenshot({ path: "stratz.png", fullPage: true });
          await b.close();
          EOF
          node run.mjs
          echo "js bytes: $(wc -c < all.js)"
          echo "--- dota2/plus paths"
          grep -oE 'dota2/plus/[^"'"'"'` )]{0,80}' all.js | sort | uniq -c | sort -rn | head -60
          echo "--- badge names"
          grep -oiE '.{60}(hero_?badge|herobadge|heroLevel|dotaPlusLevel|plusLevel|badge_rank|plusTier).{80}' all.js | head -40
          echo "--- contexts"
          grep -oE '.{300}heroLevelToTier\(t\);return void 0===l\?null.{600}' all.js | head -3
          grep -oE 'HERO_LEVEL_STEPS=.{500}' all.js | head -2
          grep -oE '.{40}plusHeroTier:.{900}' all.js | head -3
          grep -oE 'imageResources?.{0,20}=.{0,200}' all.js | head -5
          grep -oE '"https://cdn.stratz.com[^"]{0,40}"' all.js | sort -u | head
      - name: Download the badges
        run: |
          mkdir -p public/img/hero-badges
          for t in 0 1 2 3 4 5 6 7; do
            code=$(curl -s -o "public/img/hero-badges/hero_badge_$t.png" -w '%{http_code}' "https://cdn.stratz.com/images/dota2/plus/hero_badge_$t.png")
            echo "$t: $code $(file -b public/img/hero-badges/hero_badge_$t.png | cut -c1-60)"
            [ "$code" = 200 ] || rm -f "public/img/hero-badges/hero_badge_$t.png"
          done
          ls -la public/img/hero-badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/img/hero-badges
          git diff --cached --quiet || { git commit -m "Dota Plus hero badge art (STRATZ CDN)"; git push origin "HEAD:$GITHUB_REF_NAME"; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stratz-shot
          path: b/stratz.png
