# Re-sync every AD2L division from PlayOn + OpenDota on a schedule, commit the data if it
# changed, and redeploy. Picks up new schedules (predictions), results, replays OpenDota has
# parsed since, and recent pubs. Run it by hand from the Actions tab too.
name: Sync AD2L data

on:
  schedule:
    # 07:00 and 19:00 UTC = midnight and noon Pacific (PDT): midnight catches Thursday's
    # league night right after it ends, noon catches late replay parses and new schedules.
    - cron: "0 7,19 * * *"
    # Thursday 9pm Pacific, right after league night. GitHub cron is UTC only, so this is
    # Friday 04:00 UTC (9pm PDT) and 05:00 UTC (9pm PST); the other one of the pair is a
    # harmless extra run an hour off.
    - cron: "0 4,5 * * 5"
  workflow_dispatch:
    inputs:
      totals_per_run:
        description: "All-time hero totals: accounts refreshed per division this run (18 normally; ~40 to backfill)"
        default: "18"

permissions:
  contents: write # commit the synced data
  actions: write # start the Pages deploy (a push made with GITHUB_TOKEN doesn't trigger it)

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # PlayOn pages and parsed OpenDota match details (never change once parsed), carried
      # between runs so each run only fetches what's new. A new key each run keeps it rolling.
      # Restore and save are separate steps so the cache is saved even when a division
      # failed (actions/cache skips its save on a failed job, which left every run cold).
      - uses: actions/cache/restore@v4
        with:
          path: .cache
          key: sync-cache-${{ github.run_id }}
          restore-keys: sync-cache-
      # One division failing (PlayOn down, OpenDota rate limit) doesn't stop the others;
      # the job still fails at the end so it shows red.
      # The divisions come from public/lib/divisions.js; sync-all.js writes FAILED to $GITHUB_ENV.
      - name: Sync every division
        env:
          TOTALS_PER_RUN: ${{ inputs.totals_per_run }}
        run: node scripts/sync/sync-all.js || true
      # Dota Plus hero levels for every account the divisions list (public/data/hero-levels.json).
      # STRATZ being down only keeps the last run's levels; it never fails the sync.
      - name: Dota Plus hero levels (STRATZ)
        env:
          STRATZ_API_KEY: ${{ secrets.STRATZ_API_KEY }}
        run: node scripts/stratz/hero-levels.js || echo "::warning::Hero levels not refreshed (STRATZ)."
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache
          key: sync-cache-${{ github.run_id }}
      # A run where only the "updated" timestamp moved isn't worth a commit.
      - name: Drop timestamp-only changes
        run: |
          for f in $(git diff --name-only -- public/data); do
            if [ -z "$(git diff -U0 -- "$f" | grep -E '^[+-]([^+-]|$)' | grep -v '"updated":')" ]; then git checkout -- "$f"; fi
          done
      - name: Commit and push
        id: commit
        run: |
          # status, not diff: a division's first draft file (<division>-draft.json) is a new,
          # untracked file, which `git diff` doesn't see.
          if [ -z "$(git status --porcelain -- public/data)" ]; then echo "No data changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "Sync AD2L data ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "pushed=1" >> "$GITHUB_OUTPUT"
      - name: Deploy
        if: steps.commit.outputs.pushed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
      - name: Report failed divisions
        if: env.FAILED != ''
        run: |
          echo "::error::Sync failed for: ${FAILED}" && exit 1
